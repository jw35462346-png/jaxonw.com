<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me — JAW</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@400;600&family=Archivo:wght@400;500&display=swap');
  :root{ --black:#0a0a0a; --white:#f5f5f2; --gold:#c9a24b; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:var(--black);color:var(--white);font-family:'Archivo',sans-serif;position:relative;display:flex;flex-direction:column;}
  .frame{position:fixed;inset:26px;border:1px solid var(--gold);opacity:0.45;pointer-events:none;}
  .corner{position:fixed;width:34px;height:34px;border-top:2px solid var(--gold);border-left:2px solid var(--gold);z-index:2;}
  .corner.tl{top:26px;left:26px;} .corner.tr{top:26px;right:26px;transform:rotate(90deg);}
  .corner.br{bottom:26px;right:26px;transform:rotate(180deg);} .corner.bl{bottom:26px;left:26px;transform:rotate(270deg);}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;position:relative;z-index:3;}

  .page-title{font-family:'Archivo Black',sans-serif;font-size:clamp(2rem, 6vw, 2.6rem);margin-bottom:0.5rem;text-align:center;}
  .page-sub{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);opacity:0.8;margin-bottom:3rem;text-align:center;}

  .boxes{display:flex;flex-direction:column;gap:1.2rem;width:100%;max-width:420px;}
  .box{padding:1.9rem 2.2rem;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--gold);transition:all 0.3s ease;}
  .box:hover{background:rgba(201,162,75,0.08);}
  .box-label{font-family:'Cinzel',serif;font-weight:600;font-size:1.15rem;letter-spacing:0.04em;color:var(--white);}
  .box-desc{font-family:'Archivo',sans-serif;font-size:0.8rem;color:#8a8270;margin-top:0.3rem;}
  .enter-btn{font-family:'Archivo',sans-serif;font-weight:500;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);background:transparent;border:1px solid var(--gold);padding:0.55rem 1.2rem;cursor:pointer;white-space:nowrap;transition:all 0.3s ease;}
  .enter-btn:hover{background:var(--gold);color:var(--black);}

  .back{margin-top:3rem;font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:#8a8270;background:none;border:none;cursor:pointer;transition:color 0.3s ease;}
  .back:hover{color:var(--gold);}
</style>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d9c00b0814304d0aa11a9e0f54739424"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
  <div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner br"></div><div class="corner bl"></div>
  <main>
    <div class="page-title">About Me</div>
    <div class="page-sub">Jaxon Alan Wright</div>

    <div class="boxes">
      <div class="box">
        <div>
          <div class="box-label">Bio</div>
          <div class="box-desc">Get to know me</div>
        </div>
        <button class="enter-btn" onclick="window.location.href='about-bio.html'">Read</button>
      </div>

      <div class="box">
        <div>
          <div class="box-label">Business Ventures</div>
          <div class="box-desc">What I'm building</div>
        </div>
        <button class="enter-btn" onclick="window.location.href='about-ventures.html'">Explore</button>
      </div>

      <div class="box">
        <div>
          <div class="box-label">Resume</div>
          <div class="box-desc">Experience & skills</div>
        </div>
        <button class="enter-btn" onclick="window.location.href='about-resume.html'">View</button>
      </div>

      <div class="box">
        <div>
          <div class="box-label">Interests</div>
          <div class="box-desc">What I'm into</div>
        </div>
        <button class="enter-btn" onclick="window.location.href='about-interests.html'">See More</button>
      </div>
    </div>

    <button class="back" onclick="window.location.href='hub.html'">← Back</button>
  </main>
</body>
</html>
