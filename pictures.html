<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pictures — JAW</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@400;600&family=Archivo:wght@400;500&display=swap');
  :root{ --black:#0a0a0a; --white:#f5f5f2; --gold:#c9a24b; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:var(--black);color:var(--white);font-family:'Archivo',sans-serif;position:relative;display:flex;flex-direction:column;}
  .frame{position:fixed;inset:26px;border:1px solid var(--gold);opacity:0.45;pointer-events:none;}
  .corner{position:fixed;width:34px;height:34px;border-top:2px solid var(--gold);border-left:2px solid var(--gold);z-index:2;}
  .corner.tl{top:26px;left:26px;} .corner.tr{top:26px;right:26px;transform:rotate(90deg);}
  .corner.br{bottom:26px;right:26px;transform:rotate(180deg);} .corner.bl{bottom:26px;left:26px;transform:rotate(270deg);}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:4.5rem 2rem 3rem;position:relative;z-index:3;text-align:center;}
  .page-title{font-family:'Archivo Black',sans-serif;font-size:clamp(2rem, 6vw, 2.8rem);margin-bottom:0.6rem;}
  .page-sub{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);opacity:0.8;margin-bottom:2.5rem;}

  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;width:100%;max-width:1000px;}
  .gallery a{display:block;aspect-ratio:1;overflow:hidden;border:1px solid rgba(201,162,75,0.35);background:#141414;}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.35s ease,opacity 0.3s ease;}
  .gallery a:hover img{transform:scale(1.06);}

  @media (max-width:700px){
    .gallery{grid-template-columns:repeat(2,1fr);gap:0.5rem;}
  }

  .back{margin-top:3rem;font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:#8a8270;background:none;border:none;cursor:pointer;transition:color 0.3s ease;}
  .back:hover{color:var(--gold);}
</style>
</head>
<body>
  <div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner br"></div><div class="corner bl"></div>
  <main>
